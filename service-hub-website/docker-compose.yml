services:
  app:
    image: service-hub-website:local
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://servicehub:servicehub@db:5432/servicehub
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicehub
      POSTGRES_PASSWORD: servicehub
      POSTGRES_DB: servicehub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicehub -d servicehub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: