name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (se houver config de ESLint)
        run: |
          if [ -f eslint.config.mjs ] || [ -f .eslintrc.json ] || [ -f .eslintrc.js ] || [ -f .eslintrc.cjs ]; then
            npm run lint
          else
            echo "Sem config de ESLint — pulando lint."
          fi

      - name: Type check (se houver tsconfig)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit || echo "Type-check reportou problemas (não bloqueia: next.config ignora erros de tipo no build)."
          fi

      - name: Build
        run: npm run build
