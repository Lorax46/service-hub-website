services:
  app:
    image: service-hub-test:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servicehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servicehub}
      POSTGRES_DB: ${POSTGRES_DB:-servicehub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servicehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: