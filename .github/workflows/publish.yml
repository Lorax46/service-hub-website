# .github/workflows/publish.yml
name: Build and Push Multi-Arch

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./service-hub-website
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/lorax46/service-hub-website:${{ github.ref_name }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t ghcr.io/lorax46/service-hub-website:${{ github.ref_name }} \
            -t ghcr.io/lorax46/service-hub-website:latest \
            ghcr.io/lorax46/service-hub-website:${{ github.ref_name }}-amd64 \
            ghcr.io/lorax46/service-hub-website:${{ github.ref_name }}-arm64
